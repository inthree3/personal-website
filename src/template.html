<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="alternate" type="application/rss+xml" title="Stella Hwang: Writing" href="/feed.xml">
<link rel="stylesheet" href="/assets/style.css">
<script src="/assets/site.js" defer></script>
</head>
<body class="page-{{page}}">
<a class="skip-link" href="#content">Skip to content</a>
<div class="layout">
<aside class="sidebar">
<div class="sidebar-top">
<a class="identity" href="/" aria-label="Stella Hwang home"><span class="english-name">Stella Hwang</span><span class="name-rule" aria-hidden="true"></span><span class="korean-name" lang="ko">황인선</span></a>
<button class="theme-toggle" type="button" hidden aria-label="Switch color theme"><svg class="icon-sun" aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="icon-moon" aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg></button>
</div>
<nav class="site-nav" aria-label="Main navigation">{{navigation}}</nav>
<div class="sidebar-foot"><img class="avatar" src="/assets/stella-hwang.png" alt="" width="36" height="36" decoding="async"><span class="sidebar-who"><span class="sidebar-name">Stella Hwang</span><a href="/feed.xml">RSS feed</a></span></div>
</aside>
<div class="content">
<main id="content" tabindex="-1">{{content}}</main>
<footer class="site-footer"><span>Stella Hwang</span><a href="/feed.xml">RSS</a></footer>
</div>
</div>
</body>
</html>
